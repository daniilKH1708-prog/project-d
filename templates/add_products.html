<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить товар | MyStore</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            color: #f7f7fb;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 15% 25%, rgba(82, 86, 190, 0.2), transparent 34%),
                radial-gradient(circle at 90% 85%, rgba(112, 60, 180, 0.18), transparent 35%),
                #080811;
        }

        .header {
            height: 68px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: rgba(9, 9, 18, 0.82);
            border-bottom: 1px solid #1f1f2a;
        }

        .logo {
            color: #f7f7fb;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -2px;
            text-decoration: none;
        }

        .logo span {
            color: #7774ff;
        }

        .page {
            min-height: calc(100vh - 68px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 36px 20px;
        }

        .card {
            width: 100%;
            max-width: 540px;
            padding: 44px 50px;
            background: rgba(17, 17, 28, 0.96);
            border: 1px solid #2d2d3d;
            border-radius: 30px;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.4);
        }

        .icon {
            width: 74px;
            height: 74px;
            display: grid;
            place-items: center;
            margin-bottom: 26px;
            border-radius: 22px;
            background: linear-gradient(135deg, #6568f7, #a34bea);
            box-shadow: 0 16px 35px rgba(117, 82, 245, 0.3);
            font-size: 32px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 40px;
            line-height: 1.1;
        }

        .subtitle {
            margin-bottom: 34px;
            color: #9696a5;
            font-size: 18px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #d4d4df;
            font-size: 16px;
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid transparent;
            border-radius: 17px;
            outline: none;
            background: #eaf1ff;
            color: #171723;
            font: inherit;
            font-size: 17px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input {
            height: 64px;
            padding: 0 21px;
        }

        textarea {
            min-height: 125px;
            padding: 18px 21px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #7868ff;
            box-shadow: 0 0 0 4px rgba(120, 104, 255, 0.16);
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .submit-button {
            width: 100%;
            height: 65px;
            margin-top: 8px;
            border: 0;
            border-radius: 18px;
            color: white;
            background: linear-gradient(90deg, #6266f0, #8c50ed);
            box-shadow: 0 16px 32px rgba(111, 81, 237, 0.25);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }

        .submit-button:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
        }

        .separator {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 30px 0 24px;
            color: #727281;
        }

        .separator::before,
        .separator::after {
            height: 1px;
            flex: 1;
            content: "";
            background: #30303d;
        }

        .back-link {
            display: block;
            color: #9b9baa;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
        }

        .back-link:hover {
            color: #8174ff;
        }

        @media (max-width: 600px) {
            .page {
                padding: 20px 14px;
            }

            .card {
                padding: 32px 24px;
                border-radius: 24px;
            }

            h1 {
                font-size: 32px;
            }

            .two-columns {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <a class="logo" href="/products">My<span>Store</span></a>
    </header>

    <main class="page">
        <section class="card">
            <div class="icon">📦</div>

            <h1>Добавить товар</h1>
            <p class="subtitle">Заполните информацию о новом товаре</p>

            <form method="POST">
                <div class="field">
                    <label for="name">Название</label>
                    <input
                        id="name"
                        type="text"
                        name="name"
                        placeholder="Название товара"
                        required
                    >
                </div>

                <div class="two-columns">
                    <div class="field">
                        <label for="price">Цена</label>
                        <input
                            id="price"
                            type="number"
                            name="price"
                            step="0.01"
                            min="0"
                            placeholder="0.00"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="rating">Рейтинг</label>
                        <input
                            id="rating"
                            type="number"
                            name="rating"
                            step="0.1"
                            min="0"
                            max="5"
                            placeholder="0 - 5"
                        >
                    </div>
                </div>

                <div class="field">
                    <label for="image">Изображение</label>
                    <input
                        id="image"
                        type="text"
                        name="image"
                        placeholder="Ссылка на изображение"
                    >
                </div>

                <div class="field">
                    <label for="category">Категория</label>
                    <input
                        id="category"
                        type="text"
                        name="category"
                        placeholder="Категория товара"
                    >
                </div>

                <div class="field">
                    <label for="description">Описание</label>
                    <textarea
                        id="description"
                        name="description"
                        placeholder="Расскажите о товаре"
                    ></textarea>
                </div>

                <button class="submit-button" type="submit">
                    Добавить товар
                </button>
            </form>

            <div class="separator">или</div>

            <a class="back-link" href="/products">Вернуться к товарам</a>
        </section>
    </main>
</body>
</html>
